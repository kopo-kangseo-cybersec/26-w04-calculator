<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Glass Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-container">
    <div class="calculator-header">
      <div class="window-dots">
        <span class="dot red"></span>
        <span class="dot yellow"></span>
        <span class="dot green"></span>
      </div>
      <span class="brand-title">NEON.CALC</span>
    </div>

    <!-- 계산 내역 및 입력창 -->
    <div class="display-section">
      <div id="history" class="history-display"></div>
      <div id="display" class="main-display">0</div>
    </div>

    <!-- 그리드 버튼 영역 -->
    <div class="keypad">
      <button class="btn fn" data-action="clear">C</button>
      <button class="btn fn" data-action="delete">DEL</button>
      <button class="btn fn" data-action="percent">%</button>
      <button class="btn op" data-action="operator" data-val="÷">÷</button>

      <button class="btn num" data-val="7">7</button>
      <button class="btn num" data-val="8">8</button>
      <button class="btn num" data-val="9">9</button>
      <button class="btn op" data-action="operator" data-val="×">×</button>

      <button class="btn num" data-val="4">4</button>
      <button class="btn num" data-val="5">5</button>
      <button class="btn num" data-val="6">6</button>
      <button class="btn op" data-action="operator" data-val="-">-</button>

      <button class="btn num" data-val="1">1</button>
      <button class="btn num" data-val="2">2</button>
      <button class="btn num" data-val="3">3</button>
      <button class="btn op" data-action="operator" data-val="+">+</button>

      <button class="btn num span-2" data-val="0">0</button>
      <button class="btn num" data-val=".">.</button>
      <button class="btn equals" data-action="calculate">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
